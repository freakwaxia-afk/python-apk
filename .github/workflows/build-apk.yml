name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with Buildozer (official Docker image)
        run: |
          docker run --rm \
            -v "$PWD":/home/user/hostcwd \
            -v buildozer_cache:/home/user/.buildozer \
            kivy/buildozer:latest android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: python-webview-apk
          path: bin/*.apk
          if-no-files-found: error
