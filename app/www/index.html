<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Python + WebView</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: #fff; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 24px; text-align: center;
    }
    h1 { font-size: 22px; margin-bottom: 8px; }
    p { opacity: .85; }
    button {
      margin-top: 20px; padding: 12px 24px; border: 0; border-radius: 999px;
      font-size: 16px; font-weight: 600; cursor: pointer;
      background: #ffd166; color: #222;
    }
    #result {
      margin-top: 18px; padding: 14px 18px; border-radius: 12px;
      background: rgba(255,255,255,.12); min-width: 240px; min-height: 22px;
      font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 14px;
    }
  </style>
</head>
<body>
  <h1>🐍 Python + WebView</h1>
  <p>前端由 Python(Flask) 本地服务托管，原生 WebView 渲染。</p>
  <button onclick="callBackend()">调用 Python 后端</button>
  <div id="result">点击按钮试试</div>

  <script>
    async function callBackend() {
      const el = document.getElementById('result');
      el.textContent = '请求中...';
      try {
        const res = await fetch('/api/hello');
        const data = await res.json();
        el.textContent = JSON.stringify(data, null, 2);
      } catch (e) {
        el.textContent = '出错: ' + e;
      }
    }
  </script>
</body>
</html>
